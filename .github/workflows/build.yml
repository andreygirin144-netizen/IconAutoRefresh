name: Build Rootless Tweak

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ldid
        run: |
          brew install ldid

      - name: Setup Theos
        run: |
          git clone --recursive \
            https://github.com/theos/theos.git \
            "$GITHUB_WORKSPACE/theos"

          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Verify Theos and SDKs
        run: |
          echo "THEOS=$THEOS"
          echo "Available SDKs:"
          find "$THEOS/sdks" -maxdepth 1 -type d -print

      - name: Fix permissions
        run: |
          if [ -f layout/DEBIAN/postinst ]; then
            chmod 755 layout/DEBIAN/postinst
          fi

      - name: Build package
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Verify package
        run: |
          echo "Built packages:"
          ls -lh packages/

          echo "Package information:"
          file packages/*.deb

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: IconAutoRefresh-Rootless
          path: packages/*.deb
          if-no-files-found: error
